<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Fight Arena X</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c1e;color:#fff;font-family:system-ui,Arial;overflow:hidden}button,input,select{font:inherit}button{border:1px solid #5873a6;color:#fff;background:#192a58;border-radius:10px;padding:9px;touch-action:manipulation}button:active{background:#355cb0}.screen{position:absolute;inset:0;display:none;padding:15px;overflow:auto}.show{display:block}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:5px 0 9px;color:#88eeff}.roster{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.fighter{background:linear-gradient(140deg,#17224b,#532d74);border:1px solid #465a97;border-radius:12px;text-align:center;padding:8px 2px;min-height:95px}.fighter.sel{border:3px solid #37e5ed}.avatar{font-size:39px}.fighter img{height:50px;max-width:80%;object-fit:cover;border-radius:6px}.fighter small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;justify-content:center;gap:12px;margin-top:11px}.panel{background:#172142;border:1px solid #415888;padding:12px;border-radius:14px;margin:5px auto;max-width:780px}.row{display:flex;gap:8px;align-items:center;margin:7px 0;flex-wrap:wrap}input,select{background:#101b38;color:white;border:1px solid #5d6a91;border-radius:6px;padding:7px;max-width:210px}.hint{color:#b7c4e8;font-size:12px}.hud{position:absolute;top:4px;width:100%;display:flex;align-items:start;gap:8px;padding:0 14px;z-index:2}.side{flex:1}.side:last-child{text-align:right}.bar{width:100%;height:17px;background:#4c1730;border:1px solid #ddd;border-radius:6px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2cd982,#b8ff71);transition:width .2s}.energy{height:5px;background:#222;margin-top:4px;border-radius:4px}.energy>div{height:100%;background:#18d9ff}.time{font-size:19px;font-weight:bold;color:#ffe374;padding-top:8px}.arena{position:absolute;inset:0;width:100%;height:100%}.controls{position:absolute;bottom:10px;width:100%;padding:0 15px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.controls>div{display:flex;gap:6px;pointer-events:auto}.controls button{width:57px;height:53px;background:#192a58bd;font-size:13px;touch-action:none}.controls .special{width:84px;background:#764196d9}.toast{position:absolute;top:38%;width:100%;text-align:center;font-size:29px;font-weight:900;pointer-events:none;text-shadow:0 4px 12px #000}.nav{position:absolute;right:12px;top:45px;z-index:3}#admin .panel{max-width:800px}#admin{background:#091127}#admin label{width:150px;font-size:13px}#admin input{max-width:250px}#message{color:#63f9c7}
</style><style>
#intro{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 45%,#402876 0%,#141936 50%,#040818 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;transition:opacity .6s}
.intro-shield{width:96px;height:96px;background:linear-gradient(140deg,#fd8b41,#cf3a8b,#6442f0);clip-path:polygon(50% 0%,93% 20%,85% 77%,50% 100%,15% 77%,7% 20%);display:grid;place-items:center;font-size:40px;font-weight:1000;text-shadow:0 3px 5px #000;animation:pulse 1.1s infinite alternate}
.intro-name{font-size:28px;font-weight:900;letter-spacing:4px}.intro-progress{width:180px;height:7px;border:1px solid #7293a8;border-radius:7px;overflow:hidden}.intro-progress>div{height:100%;width:100%;background:linear-gradient(90deg,#28e3f2,#f59334);animation:load 2.2s both}.intro-name+small,#intro small{color:#9cafe0;letter-spacing:2px;font-size:10px}
@keyframes pulse{to{transform:scale(1.13);filter:drop-shadow(0 0 18px #ff68ae)}}@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.fighter{min-height:122px;background:linear-gradient(155deg,#1e2b56,#342659);transition:transform .2s}.fighter.sel{background:linear-gradient(130deg,#293d67,#6a337f);transform:translateY(-3px)}
.fighter .avatar{height:83px;overflow:hidden}.fighter img{height:82px;width:80px;max-width:95%;object-fit:cover;object-position:center 18%;border:2px solid #a4bbcf;border-radius:12px}
.fighter small:last-child{font-size:9px}.roster{grid-template-columns:repeat(5,minmax(0,1fr));max-width:1050px;margin:7px auto}
#game .toast{font-style:italic;color:#ffe766}.controls button{border:1px solid #a4c9f8;background:linear-gradient(120deg,#243461ce,#423976db);box-shadow:0 3px 10px #080c1f}
</style></head><body>
<div id="intro"><div class="intro-shield">FX</div><div class="intro-name">FIGHT ARENA X</div><div class="intro-progress"><div></div></div><small>LOADING FIGHTERS...</small></div><section id="menu" class="screen show"><header><h1>⚔ FIGHT ARENA X</h1><button onclick="openAdmin()">⚙ ADMIN</button></header><div class="hint">Choose your fighter • portraits are linked to public photo sources • tap fighter to select</div><div class="roster" id="roster"></div><div class="actions"><button onclick="startFight()">▶ START FIGHT</button><button onclick="randomPick()">🎲 RANDOM</button></div></section>
<section id="game" class="screen"><canvas class="arena" id="canvas"></canvas><div class="hud"><div class="side"><strong id="pname"></strong><div class="bar"><div id="php" class="fill"></div></div><div class="energy"><div id="peng"></div></div></div><div class="time" id="clock">60</div><div class="side"><strong id="ename"></strong><div class="bar"><div id="ehp" class="fill"></div></div><div class="energy"><div id="eeng"></div></div></div></div><button class="nav" onclick="backMenu()">☰ MENU</button><div class="toast" id="toast"></div><div class="controls"><div><button id="left">◀</button><button id="right">▶</button><button id="jump">JUMP</button></div><div><button id="punch">PUNCH</button><button id="kick">KICK</button><button class="special" id="power">POWER</button></div></div></section>
<section id="admin" class="screen"><header><h1>⚙ CHARACTER ADMIN</h1><button onclick="go('menu')">BACK</button></header><div class="panel"><div class="row"><label>Select Fighter</label><select id="admFighter" onchange="loadAdmin()"></select></div><div class="row"><label>Character Name</label><input id="admName"></div><div class="row"><label>Ability Name</label><input id="admPower"></div><div class="row"><label>Damage</label><input id="admDamage" type="number" min="5" max="80"></div><div class="row"><label>Hits to unlock</label><input id="admHits" type="number" min="1" max="30"></div><div class="row"><label>Character Image</label><input id="admImage" type="file" accept="image/*"></div><div class="row"><label>Custom Power Sound</label><input id="admSound" type="file" accept="audio/*"></div><div class="actions"><button onclick="saveAdmin()">💾 SAVE</button><button onclick="resetAdmin()">RESET FIGHTER</button></div><p id="message" class="hint">Saved locally on this phone. Each character can have its own photo and special attack sound.</p></div></section>
<script>
const defaults=[
{name:'Hamba',emoji:'👩',power:'CUSTOM POWER',damage:25,hits:5,color:'#e84b9e'},
{name:'Mark Zuckerberg',emoji:'👨🏻‍💻',power:'SOCIAL MEDIA STORM',damage:31,hits:6,color:'#2696e8',image:'https://commons.wikimedia.org/wiki/Special:FilePath/Mark_Zuckerberg_(2025).jpg?width=350'},
{name:'Elon Musk',emoji:'🚀',power:'ROCKET & TESLA DROP',damage:35,hits:7,color:'#dedede',image:'https://commons.wikimedia.org/wiki/Special:FilePath/Elon_Musk_(cropped).jpg?width=350'},
{name:'Donald Trump',emoji:'🧑🏼‍💼',power:'50% TAX SIGN',damage:32,hits:6,color:'#e9b85d',image:'https://commons.wikimedia.org/wiki/Special:FilePath/Donald_Trump_official_portrait,_2025_(headshot).jpg?width=350'},
{name:'Narendra Modi',emoji:'🇮🇳',power:'CHAI ENERGY',damage:29,hits:5,color:'#f7dc5b',image:'https://commons.wikimedia.org/wiki/Special:FilePath/The_official_portrait_of_Shri_Narendra_Modi,_the_Prime_Minister_of_the_Republic_of_India.jpg?width=350'},
{name:'Sheikh Hasina',emoji:'🇧🇩',power:'SHIELD STORM',damage:30,hits:5,color:'#fa6440',image:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5d/Sheikh_Hasina_2019.jpg/320px-Sheikh_Hasina_2019.jpg'},
{name:'Frost',emoji:'❄️',power:'ICE SHARDS',damage:28,hits:5,color:'#7ae1ff'},
{name:'Shadow',emoji:'🥷',power:'SHADOW DASH',damage:27,hits:4,color:'#7d68b3'},
{name:'Mecha',emoji:'🤖',power:'LASER BEAM',damage:33,hits:6,color:'#c3e0e7'},
{name:'Storm',emoji:'🌪️',power:'CYCLONE',damage:30,hits:5,color:'#a0b0fa'}
];let fighters;try{let saved=JSON.parse(localStorage.getItem('fighters'));fighters=defaults.map((d,i)=>saved&&saved[i]&&saved[i].name===d.name?{...d,...saved[i]}:{...d});}catch(e){fighters=defaults.map(x=>({...x}))}
let selected=0,enemyIndex=1,playing=false,player,enemy,last=0,elapsed=0,effect=null,activeKeys={},ctx,canvas=document.getElementById('canvas');
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show')}
function renderRoster(){let r=document.getElementById('roster');r.innerHTML='';fighters.forEach((f,i)=>{let d=document.createElement('div');d.className='fighter'+(i===selected?' sel':'');d.onclick=()=>{selected=i;renderRoster()};d.innerHTML='<div class="avatar">'+(f.image?'<img src="'+f.image+'">':f.emoji)+'</div><small>'+f.name+'</small><small style="color:#87f6ff">'+f.power+'</small>';r.appendChild(d)})}
function randomPick(){selected=Math.floor(Math.random()*fighters.length);renderRoster()}
function makeUnit(index,x){return {index,x,y:0,hp:100,energy:0,hits:0,dir:1,flash:0,attack:0,vx:0,vy:0}}
function startFight(){enemyIndex=(selected+1+Math.floor(Math.random()*9))%10;player=makeUnit(selected,.28);enemy=makeUnit(enemyIndex,.72);enemy.dir=-1;elapsed=0;effect=null;playing=true;last=performance.now();go('game');updateHud();requestAnimationFrame(loop)}
function backMenu(){playing=false;go('menu');renderRoster()}
function updateHud(){document.getElementById('pname').textContent=fighters[selected].name;document.getElementById('ename').textContent=fighters[enemyIndex].name;document.getElementById('php').style.width=player.hp+'%';document.getElementById('ehp').style.width=enemy.hp+'%';document.getElementById('peng').style.width=Math.min(100,player.hits/fighters[selected].hits*100)+'%';document.getElementById('eeng').style.width=Math.min(100,enemy.hits/fighters[enemyIndex].hits*100)+'%';document.getElementById('clock').textContent=Math.max(0,60-Math.floor(elapsed))}
let toastId=0;function showToast(s){let el=document.getElementById('toast');el.textContent=s;const n=++toastId;setTimeout(()=>{if(n===toastId)el.textContent=''},900)}
function tone(f=210,d=.12){try{let ac=window.AudioContext?new AudioContext():new webkitAudioContext();let osc=ac.createOscillator(),g=ac.createGain();osc.frequency.value=f;osc.type='sawtooth';g.gain.setValueAtTime(.13,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);osc.connect(g).connect(ac.destination);osc.start();osc.stop(ac.currentTime+d);setTimeout(()=>ac.close(),500)}catch(e){}}
function audioFor(i){let f=fighters[i];if(f.sound){try{new Audio(f.sound).play().catch(()=>tone(320,.4))}catch(e){tone(320,.4)}}else tone(320,.3)}
function attack(from,to,type){if(!playing||from.attack>0)return;let fi=fighters[from.index];from.attack=type==='power'?.85:.26;let reach=type==='power'?.52:.17,damage=type==='punch'?8:type==='kick'?13:fi.damage;if(type==='power'){if(from.hits<fi.hits){if(from===player)showToast('LAND MORE HITS');return}from.hits=0;effect={kind:from.index,time:.85,from:from.x,to:to.x};audioFor(from.index);showToast(fi.power)}else tone(type==='punch'?150:110,.13);if(Math.abs(from.x-to.x)<reach){to.hp=Math.max(0,to.hp-damage);to.flash=.25;to.x=Math.max(.07,Math.min(.93,to.x+(from.x<to.x?.035:-.035)));if(type!=='power'){from.hits++;from.energy=Math.min(100,from.energy+12)}if(to.hp===0){playing=false;showToast((from===player?'YOU WIN!':'YOU LOSE!')+' K.O.')}updateHud()}}
function act(a){if(!playing)return;if(a==='punch'||a==='kick'||a==='power')attack(player,enemy,a);if(a==='jump'&&player.y===0)player.vy=1.05}
['left','right','jump','punch','kick','power'].forEach(id=>{let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();if(id==='left'||id==='right')activeKeys[id]=true;else act(id)});['pointerup','pointercancel','pointerleave'].forEach(evt=>b.addEventListener(evt,()=>activeKeys[id]=false))});
document.addEventListener('keydown',e=>{let a={ArrowLeft:'left',ArrowRight:'right',' ':'jump',j:'punch',k:'kick',l:'power'}[e.key];if(!a)return;if(a==='left'||a==='right')activeKeys[a]=true;else if(!e.repeat)act(a)});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')activeKeys.left=false;if(e.key==='ArrowRight')activeKeys.right=false});
function person(unit,w,h){
let f=fighters[unit.index],x=unit.x*w,y=h*.76-unit.y*h*.24;
let sz=Math.max(44,h*.235),s=sz/120;
ctx.save();ctx.translate(x,y);ctx.scale(unit.dir*s,s);
let attacking=unit.attack>0,lean=attacking?13:0;
ctx.shadowColor=unit.flash>0?'white':f.color;ctx.shadowBlur=unit.flash>0?38:18;
function limb(x1,y1,x2,y2,wid,col){let g=ctx.createLinearGradient(x1,y1,x2,y2);g.addColorStop(0,'#f4e4cc');g.addColorStop(.25,col);g.addColorStop(1,'#121b3b');ctx.strokeStyle=g;ctx.lineWidth=wid;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
limb(-13,-60,-27,-12,22,'#39416b');limb(16,-60,26,-11,22,f.color);
ctx.fillStyle='#121a2d';ctx.beginPath();ctx.ellipse(-28,-6,24,11,.05,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(28,-6,24,11,.05,0,7);ctx.fill();
let bg=ctx.createLinearGradient(-24,-115,28,-36);bg.addColorStop(0,'#e0ebfa');bg.addColorStop(.25,f.color);bg.addColorStop(1,'#141a37');
ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(-28,-111);ctx.lineTo(25+lean,-108);ctx.lineTo(24,-50);ctx.lineTo(-23,-50);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffffff77';ctx.lineWidth=2;ctx.stroke();
limb(-22,-104,-42,-73,18,f.color);limb(-42,-73,-35,-48,15,'#f6d5b5');
limb(24,-102,attacking?65:40,attacking?-94:-70,18,f.color);limb(attacking?65:40,attacking?-94:-70,attacking?100:32,attacking?-92:-45,16,'#f6d5b5');
ctx.shadowBlur=0;
const source=f.image,im=source?getPic(source):null;
if(im&&im.complete&&im.naturalWidth){
 ctx.save();ctx.beginPath();ctx.arc(0,-137,27,0,Math.PI*2);ctx.clip();ctx.drawImage(im,-30,-167,60,60);ctx.restore();
}else {ctx.fillStyle='#e2b38f';ctx.beginPath();ctx.arc(0,-137,27,0,7);ctx.fill();ctx.font='29px system-ui';ctx.textAlign='center';ctx.fillText(f.emoji,0,-126);}
ctx.strokeStyle='#c4f7ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-137,27,0,7);ctx.stroke();ctx.restore();
}
const cache={};function getPic(src){if(!cache[src]){let im=new Image();im.src=src;cache[src]=im;}return cache[src]}
function draw(){let w=window.innerWidth,h=window.innerHeight;if(canvas.width!==w*devicePixelRatio||canvas.height!==h*devicePixelRatio){canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;canvas.style.width=w+'px';canvas.style.height=h+'px'}ctx=canvas.getContext('2d');ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#101b53');sky.addColorStop(.65,'#462c77');sky.addColorStop(1,'#101327');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#162a44';ctx.fillRect(0,h*.77,w,h*.23);ctx.strokeStyle='#49bff677';for(let i=0;i<12;i++){ctx.beginPath();ctx.moveTo(i*w/11,h*.77);ctx.lineTo(w*.5+(i-5.5)*w*.12,h);ctx.stroke()}for(let j=0;j<4;j++){ctx.beginPath();ctx.moveTo(0,h*(.77+j*.077));ctx.lineTo(w,h*(.77+j*.077));ctx.stroke()}ctx.font=Math.floor(h*.12)+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#ad9cff33';ctx.fillText('FIGHT ARENA X',w/2,h*.47);person(player,w,h);person(enemy,w,h);if(effect&&effect.time>0){let x=(effect.from+effect.to)/2*w;ctx.save();ctx.translate(x,h*.48);ctx.shadowColor='#86d9ff';ctx.shadowBlur=30;ctx.fillStyle=effect.kind===3?'#ffe66e':'#8beaff';ctx.globalAlpha=Math.min(1,effect.time*2);let glyph=['💗','📱','🚀','50% TAX','☕','🛡️','❄️','💨','🔫','🌪️'][effect.kind];ctx.font=Math.floor(h*.17)+'px system-ui';ctx.fillText(glyph,0,0);ctx.restore()}}
function loop(now){if(!playing)return;let dt=Math.min(.04,(now-last)/1000||.016);last=now;elapsed+=dt;if(activeKeys.left)player.x=Math.max(.08,player.x-dt*.34);if(activeKeys.right)player.x=Math.min(.92,player.x+dt*.34);player.dir=player.x<enemy.x?1:-1;enemy.dir=-player.dir;for(let u of [player,enemy]){u.attack=Math.max(0,u.attack-dt);u.flash=Math.max(0,u.flash-dt);u.y=Math.max(0,u.y+u.vy*dt);if(u.y>0)u.vy-=dt*2.9;else u.vy=0}if(effect)effect.time-=dt;if(Math.abs(enemy.x-player.x)>.13)enemy.x+=(player.x<enemy.x?-1:1)*dt*.10;else if(Math.random()<dt*.48)attack(enemy,player,'punch');if(enemy.hits>=fighters[enemyIndex].hits&&Math.random()<dt*.13)attack(enemy,player,'power');if(elapsed>=60){playing=false;showToast(player.hp>=enemy.hp?'YOU WIN!':'YOU LOSE!')}updateHud();draw();if(playing)requestAnimationFrame(loop)}
function openAdmin(){go('admin');let s=document.getElementById('admFighter');s.innerHTML=fighters.map((f,i)=>'<option value="'+i+'">'+f.name+'</option>').join('');s.value=String(selected);loadAdmin()}
function loadAdmin(){let f=fighters[+document.getElementById('admFighter').value];document.getElementById('admName').value=f.name;document.getElementById('admPower').value=f.power;document.getElementById('admDamage').value=f.damage;document.getElementById('admHits').value=f.hits}
function readFile(id){return new Promise(resolve=>{let x=document.getElementById(id);if(!x.files.length)return resolve(null);let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(x.files[0])})}
async function saveAdmin(){let i=+document.getElementById('admFighter').value,f=fighters[i];f.name=document.getElementById('admName').value.trim()||f.name;f.power=document.getElementById('admPower').value.trim()||f.power;f.damage=Math.max(5,Math.min(80,+document.getElementById('admDamage').value||25));f.hits=Math.max(1,Math.min(30,+document.getElementById('admHits').value||5));let image=await readFile('admImage'),sound=await readFile('admSound');if(image)f.image=image;if(sound)f.sound=sound;try{localStorage.setItem('fighters',JSON.stringify(fighters));document.getElementById('message').textContent='SAVED ON THIS PHONE ✓';renderRoster()}catch(e){document.getElementById('message').textContent='Storage full. Try smaller image/audio files.'}}
function resetAdmin(){let i=+document.getElementById('admFighter').value;fighters[i]={...defaults[i]};try{localStorage.setItem('fighters',JSON.stringify(fighters))}catch(e){}loadAdmin();renderRoster()}
renderRoster();setTimeout(()=>{const el=document.getElementById('intro');el.style.opacity='0';setTimeout(()=>el.remove(),650)},2500);
</script></body></html>
